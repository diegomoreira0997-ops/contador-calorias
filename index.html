<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rótulo Diário — Contador de Calorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="mainWrap" style="display:none;">

  <div class="greeting">
    <h1 id="greetingText">—</h1>
    <div class="date" id="greetingDate">—</div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn" data-tab="diario">Diário</button>
    <button class="tab-btn" data-tab="alimentos">Alimentos</button>
    <button class="tab-btn" data-tab="atividades">Atividades</button>
    <button class="tab-btn" data-tab="mensal">Resumo Mensal</button>
    <button class="tab-btn" data-tab="perfil">Perfil</button>
  </div>

  <div id="app" class="loading">Carregando seus dados…</div>

</div>

<div class="wrap" id="authWrap" style="display:none;max-width:380px;padding-top:60px;">
  <div class="card">
    <h2 id="authTitle">Entrar</h2>
    <label for="authEmail">E-mail</label>
    <input type="text" id="authEmail" placeholder="voce@email.com" autocomplete="username">
    <label for="authPassword">Senha</label>
    <input type="password" id="authPassword" placeholder="mínimo 6 caracteres" autocomplete="current-password">
    <button class="primary" id="authSubmitBtn" style="margin-top:14px;width:100%;">Entrar</button>
    <div class="msg" id="authMsg"></div>
    <div style="text-align:center;margin-top:14px;font-size:13px;color:var(--text-muted);">
      <span id="authToggleText">Ainda não tem conta?</span>
      <button class="ghost" id="authToggleBtn" style="margin-left:4px;">Criar conta</button>
    </div>
  </div>
</div>

<div id="authLoading" class="loading">Carregando…</div>

<div id="toast"><span id="toastMsg"></span><button id="toastUndoBtn">Desfazer</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
